[package]
name = "obelisk-cli"
# The command-line front end's own version, apart from Obelisk's.
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "obelisk-cli"
path = "src/main.rs"

[dependencies]
obelisk-bridge = { path = "../obelisk-bridge" }
game-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util"] }
# The login Keychain, where the Steam session is kept.
security-framework = "3"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
